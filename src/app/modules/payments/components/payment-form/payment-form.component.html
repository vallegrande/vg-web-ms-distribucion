<div class="mb-4">
  <nav class="mb-2 text-sm text-gray-500">
    <button class="hover:text-gray-700">Dashboard</button>
    <span class="mx-2">/</span>
    <button class="hover:text-gray-700">Pagos</button>
    <span class="mx-2">/</span>
    <span class="text-gray-900">
      {{ isEditMode ? "Editar Pago" : "Nuevo Pago" }}
    </span>
  </nav>
  <h1 class="text-xl font-bold text-gray-900">
    {{ isEditMode ? "Editar Pago" : "Nuevo Pago" }}
  </h1>
</div>

<!-- Success Alert -->
<div *ngIf="showSuccessAlert" class="p-4 mb-4 bg-green-100 border border-green-400 rounded-md">
  <div class="flex">
    <div class="flex-shrink-0">
      <svg class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          clip-rule="evenodd" />
      </svg>
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium text-green-800">
        Pago guardado correctamente
      </p>
    </div>
  </div>
</div>

<!-- Error Alert -->
<div *ngIf="showErrorAlert" class="p-4 mb-4 bg-red-100 border border-red-400 rounded-md">
  <div class="flex">
    <div class="flex-shrink-0">
      <svg class="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd" />
      </svg>
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium text-red-800">
        Por favor, completa todos los campos requeridos correctamente
      </p>
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="loading" class="p-6 text-center bg-white border border-gray-200 rounded-lg shadow-sm">
  <div class="w-6 h-6 mx-auto border-b-2 border-blue-600 rounded-full animate-spin"></div>
  <p class="mt-2 text-sm text-gray-500">Cargando...</p>
</div>

<!-- Formulario -->
<div *ngIf="!loading"
  class="bg-white rounded-lg border border-gray-200 shadow-sm max-h-[calc(100vh-120px)] overflow-y-auto">
  <form [formGroup]="paymentForm" (ngSubmit)="submit()" class="p-4 space-y-4">
    <!-- Selección Usuario -->
    <div class="lg:col-span-3">
      <label for="userId" class="block mb-1 text-sm font-medium text-left text-gray-700">
        Usuario *
      </label>
      <select id="userId" formControlName="userId"
        class="block w-2/3 px-3 py-2 mx-auto text-sm text-center border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
        <option value="">Seleccionar usuario...</option>
        <option *ngFor="let user of users" [value]="user.id">

          <ng-container *ngIf="user.firstName || user.lastName || user.email">
            {{ user.firstName || '' }} {{ user.lastName || '' }} - ({{ user.email || '' }})
          </ng-container>
        </option>
      </select>
    </div>

    <!-- Información Personal - Grid más amplio -->
    <div formGroupName="clientInfo" class="pb-4 border-b border-gray-200">
      <h3 class="mb-3 text-base font-medium text-gray-900">
        Información Personal
      </h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- Documento -->
        <div>
          <label for="documentNumber" class="block mb-1 text-sm font-medium text-gray-700">
            Número Documento *
          </label>
          <input id="documentNumber" type="text" formControlName="documentNumber" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Nombres -->
        <div>
          <label for="firstName" class="block mb-1 text-sm font-medium text-gray-700">
            Nombres *
          </label>
          <input id="firstName" type="text" formControlName="firstName" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Apellidos -->
        <div>
          <label for="lastName" class="block mb-1 text-sm font-medium text-gray-700">
            Apellidos *
          </label>
          <input id="lastName" type="text" formControlName="lastName" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block mb-1 text-sm font-medium text-gray-700">
            Email *
          </label>
          <input id="email" type="text" formControlName="email" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Teléfono -->
        <div>
          <label for="phone" class="block mb-1 text-sm font-medium text-gray-700">
            Teléfono *
          </label>
          <input id="phone" type="text" formControlName="phone" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Localidad -->
        <div formGroupName="address">
          <label for="localityName" class="block mb-1 text-sm font-medium text-gray-700">
            Zona *
          </label>
          <input id="localityName" type="text" formControlName="localityName" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Calle -->
        <div formGroupName="address">
          <label for="streetName" class="block mb-1 text-sm font-medium text-gray-700">
            Calle *
          </label>
          <input id="streetName" type="text" formControlName="streetName" readonly class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>
      </div>
    </div>

    <!-- Información de Pago -->
    <div class="pb-4 border-b border-gray-200">
      <h3 class="mb-3 text-base font-medium text-gray-900">
        Información del Pago
      </h3>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- Organización -->
        <div>
          <label for="organizationId" class="block mb-1 text-sm font-medium text-gray-700">
            Organización *
          </label>

          <input type="text" [value]="organizationName" placeholder="Nombre de la organización"
            class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            readonly />
          <input type="hidden" formControlName="organizationId" />
        </div>

        <!-- Código de Pago -->
        <div>
          <label for="paymentCode" class="block mb-1 text-sm font-medium text-gray-700">
            Código de Pago *
          </label>
          <input id="paymentCode" type="text" formControlName="paymentCode" readonly
            class="block w-full px-3 py-2 text-sm text-center border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Caja de Agua -->
        <div>
          <label for="waterBoxId" class="block mb-1 text-sm font-medium text-gray-700">
            N° de Suministro *
          </label>
          <input id="waterBoxId" type="text" formControlName="waterBoxId" placeholder="N° de Suministro" readonly
            class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Tipo de Pago -->
        <div>
          <label for="paymentType" class="block mb-1 text-sm font-medium text-gray-700">
            Tipo de Pago *
          </label>
          <select id="paymentType" formControlName="paymentType"
            class="block w-full px-3 py-2 text-sm text-center border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            <option value="AGUA">Servicio de Agua</option>
            <option value="REPOSICION">Reposición</option>
              <option value="MIXTO">Mixto</option>
          </select>
        </div>

        <!-- Método de Pago -->
        <div>
          <label for="paymentMethod" class="block mb-1 text-sm font-medium text-gray-700">
            Método de Pago *
          </label>
          <select id="paymentMethod" formControlName="paymentMethod"
            class="block w-full px-3 py-2 text-sm text-center border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Seleccionar Pago</option>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="MIXTO">Mixto</option>
          </select>
        </div>

        <!-- Monto Total -->
        <div>
          <label for="totalAmount" class="block mb-1 text-sm font-medium text-gray-700">
            Monto Total *
          </label>
          <input id="totalAmount" type="number" formControlName="totalAmount" readonly
            class="block w-full px-3 py-2 text-sm bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
        </div>

        <!-- Fecha de Pago -->
        <div>
          <label for="paymentDate" class="block mb-1 text-sm font-medium text-gray-700">
            Fecha de Pago *
          </label>
          <input id="paymentDate" type="date" formControlName="paymentDate"
            class="block w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- Estado de Pago -->
        <div>
          <label for="paymentStatus" class="block mb-1 text-sm font-medium text-gray-700">
            Estado de Pago *
          </label>
          <select id="paymentStatus" formControlName="paymentStatus"
            class="block w-full px-3 py-2 text-sm text-center border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Seleccionar estado...</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="PAGADO">Pagado</option>
            <option value="CANCELADO">Anulado</option>
          </select>
        </div>

        <!-- Referencia Externa -->
        <div class="lg:col-span-2">
          <label for="externalReference" class="block mb-1 text-sm font-medium text-gray-700">
            Referencia Externa
          </label>
          <input id="externalReference" type="text" formControlName="externalReference"
            class="block w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500" />
        </div>
      </div>
    </div>


    <!-- Detalles del Pago -->
    <div class="pb-4 border-b border-gray-200">
      <h3 class="mb-3 text-base font-medium text-gray-900">
        Detalles del Pago
      </h3>
      <div formArrayName="details">
        <div *ngFor="let detail of details.controls; let i = index" [formGroupName]="i"
          class="grid grid-cols-1 gap-3 p-3 mb-2 rounded-md sm:grid-cols-2 lg:grid-cols-4 bg-gray-50">
          <!-- Concepto -->
          <div>
            <label class="text-sm font-medium"> Concepto * </label>
            <select formControlName="concept"
              class="block w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
              <option *ngFor="let concept of concepts" [value]="concept.value">
                {{ concept.label }}
              </option>
            </select>
          </div>

          <!-- Año (No editable) -->
          <div>
            <label class="text-sm font-medium">Año *</label>
            <input type="number" formControlName="year" readonly
              class="block w-full px-3 py-2 text-sm text-center bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
          </div>

          <!-- Mes -->
          <div>
            <label class="text-sm font-medium">Mes *</label>
            <select formControlName="month"
              class="block w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
              <option *ngFor="let month of months" [value]="month.value">
                {{ month.name }}
              </option>
            </select>
          </div>

          <!-- Monto (No editable) -->
          <div>
            <label class="text-sm font-medium">Monto *</label>
            <input type="number" formControlName="amount" readonly
              class="block w-full px-3 py-2 text-sm bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
          </div>

          <!-- Descripción -->
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">Descripción *</label>
            <input type="text" formControlName="description" readonly
              class="block w-full px-3 py-2 text-sm bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
          </div>

          <!-- Inicio Periodo (No editable) -->
          <div>
            <label class="text-sm font-medium">Inicio Periodo *</label>
            <input type="date" formControlName="periodStart" readonly
              class="block w-full px-3 py-2 text-sm bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
          </div>

          <!-- Fin Periodo (No editable) -->
          <div>
            <label class="text-sm font-medium">Fin Periodo *</label>
            <input type="date" formControlName="periodEnd" readonly
              class="block w-full px-3 py-2 text-sm bg-gray-100 border border-gray-300 rounded-md cursor-not-allowed" />
          </div>

          <div class="flex items-end">
            <button type="button" (click)="removeDetail(i)" class="px-3 py-1 text-white bg-red-500 rounded-md">
              Quitar
            </button>
          </div>
        </div>
        <button type="button" (click)="addDetail()" class="px-4 py-2 mt-2 text-white bg-blue-500 rounded-md">
          + Agregar Detalle
        </button>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex flex-col-reverse gap-2 pt-4 border-t border-gray-200 sm:flex-row sm:items-center sm:justify-end">
      <button type="button" (click)="cancel()"
        class="w-full px-4 py-2 text-sm font-medium text-white bg-red-500 border border-gray-300 rounded-md hover:bg-red-700 sm:w-auto">
        Cancelar
      </button>
      <button type="submit" [disabled]="submitting"
        class="inline-flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700 disabled:opacity-50 sm:w-auto">
        <div *ngIf="submitting"
          class="w-4 h-4 mr-2 -ml-1 border-2 border-white rounded-full border-t-transparent animate-spin"></div>
        Enviar
      </button>
    </div>
  </form>
</div>
